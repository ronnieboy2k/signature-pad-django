<!-- signatures/templates/signatures/signature_form.html -->
{% extends "base.html" %} {% load static %} {% block extra_head %}
<script src="{% static 'signatures/signature-pad-js.js' %}"></script>
{% endblock extra_head %} {% block content %}
<form method="post">
  {% csrf_token %}

  <div>
    <label for="name">Name</label>

    <input type="text" id="name" name="name" required />
  </div>

  <div>
    <label for="signature">Signature</label>

    <canvas id="signature" width="600" height="304"></canvas>
  </div>

  <div>
    <button type="button" id="clearSignature">Clear</button>
    <button type="button" id="saveSignature">Save</button>

    <button type="submit">Submit</button>
  </div>
</form>

<script>
  const signature1 = signaturePad(
    "signature",
    "clearSignature",
    "saveSignature",
  );
</script>
{% endblock content %}
